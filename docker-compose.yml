services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localvibe
      POSTGRES_DB: localvibe
    ports:
      - "5432:5432"
    volumes:
      - localvibe-db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      DATABASE_URL: postgres://postgres:localvibe@db:5432/localvibe
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "5000:5000"
    depends_on:
      - backend

  seed:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      DATABASE_URL: postgres://postgres:localvibe@db:5432/localvibe
    depends_on:
      - db
    command: ["node", "seed.cjs"]
    profiles: ["seed"]

volumes:
  localvibe-db:
